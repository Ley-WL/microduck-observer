[Service]
Environment=MICRODUCK_CAMERA_CONTROL=1
Environment=MICRODUCK_CAMERA_SETTINGS=/var/lib/microduck-observer/camera.json
SupplementaryGroups=video
DeviceAllow=char-video4linux rw
DeviceAllow=char-media rw
DeviceAllow=/dev/rga rw
DeviceAllow=/dev/mpp_service rw
DeviceAllow=/dev/dma_heap/system rw
DeviceAllow=/dev/dma_heap/system-uncached rw
KillMode=control-group
